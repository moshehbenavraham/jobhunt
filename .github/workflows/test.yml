name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-go@v7
        with:
          go-version-file: dashboard/go.mod
      - run: npm install
      - run: npx playwright install chromium
      - name: Install PDF validation tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk qpdf poppler-utils mupdf-tools
      - run: npm run safety:audit
      - run: node scripts/test-all.mjs --quick
